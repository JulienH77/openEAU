name: Mise à jour des données OpenEAU

on:
  workflow_dispatch:

  schedule:
    # Toutes les 30 minutes à xx:17 et xx:47.
    - cron: "17,47 * * * *"
      timezone: "Europe/Paris"

permissions:
  contents: write

concurrency:
  group: update-open-eau-data
  cancel-in-progress: true

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Générer les données
        run: |
          python scripts/update_data.py

      - name: Vérifier les fichiers générés
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          stations_path = Path("data/stations.json")
          live_path = Path("data/live.json")
          normals_path = Path("data/normals.json")
          history_dir = Path("data/history")

          for path in [stations_path, live_path, normals_path]:
              if not path.exists():
                  raise SystemExit(f"Fichier absent : {path}")

          stations = json.loads(stations_path.read_text())
          live = json.loads(live_path.read_text())
          history_files = list(history_dir.glob("*.json"))

          print("Stations :", stations.get("count"))
          print("Live :", live.get("count"))
          print("Historiques :", len(history_files))

          if stations.get("count", 0) == 0:
              raise SystemExit("Aucune station générée.")

          if live.get("count", 0) == 0:
              raise SystemExit("Aucune mesure générée.")

          if not history_files:
              raise SystemExit("Aucun historique généré.")
          PY

      - name: Commit des données
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/stations.json
          git add data/live.json
          git add data/normals.json
          git add data/history/

          if git diff --cached --quiet; then
            echo "Aucune modification de données."
            exit 0
          fi

          git commit -m "chore(data): mise à jour hydrométrique"
          git push
